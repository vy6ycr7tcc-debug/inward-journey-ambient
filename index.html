<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inward Journey Ambient</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app"></div>

    <div id="ui-layer">
      <!-- Title Screen -->
      <div id="title-screen" class="screen">
        <div class="content">
          <h1>INWARD JOURNEY</h1>
          <h2>Ambient</h2>
          <p class="blink">Press OK to begin</p>
        </div>
      </div>

      <!-- Chapter Select -->
      <div id="chapter-select" class="screen hidden">
        <div class="cards-container">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- In-Flight HUD -->
      <div id="hud" class="screen hidden">
        <div id="hud-info" class="fade">
          <h2 id="hud-chapter">Chapter Name</h2>
          <p id="hud-track">Track Name</p>
        </div>
        <div id="pause-overlay" class="hidden">
          <h2>Paused</h2>
          <p>Press OK to resume</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
